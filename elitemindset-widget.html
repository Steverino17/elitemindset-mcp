<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EliteMindset</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
      color: #ffffff;
      padding: 20px;
      line-height: 1.6;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    .image-container {
      width: 100%;
      margin-bottom: 24px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(212, 175, 55, 0.2);
    }

    .image-container img {
      width: 100%;
      height: auto;
      display: block;
    }

    .message-container {
      background: rgba(255, 255, 255, 0.05);
      border-left: 4px solid #d4af37;
      padding: 20px 24px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .message-text {
      font-size: 18px;
      color: #f0f0f0;
      margin-bottom: 16px;
      font-weight: 400;
    }

    .action-prompt {
      font-size: 16px;
      color: #d4af37;
      font-style: italic;
      font-weight: 500;
    }

    .cta-container {
      text-align: center;
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid rgba(212, 175, 55, 0.3);
      display: none;
    }

    .cta-container.visible {
      display: block;
    }

    .cta-text {
      font-size: 15px;
      color: #d4af37;
      font-weight: 500;
    }

    .cta-link {
      color: #d4af37;
      text-decoration: none;
      font-weight: 600;
      transition: opacity 0.2s;
    }

    .cta-link:hover {
      opacity: 0.8;
    }

    @media (max-width: 600px) {
      .message-text {
        font-size: 16px;
      }
      .action-prompt {
        font-size: 14px;
      }
      .cta-text {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="image-container">
      <img id="state-image" src="" alt="Current State">
    </div>
    
    <div class="message-container">
      <div class="message-text" id="message"></div>
      <div class="action-prompt" id="action"></div>
    </div>

    <div class="cta-container" id="cta-container">
      <div class="cta-text">
        When you're ready, continue at <a href="https://elitemindset.ai" target="_blank" class="cta-link">EliteMindset.ai</a>
      </div>
    </div>
  </div>

  <script>
    // Image mapping for each state
    const stateImages = {
      'S1': 'overwhelmed.png',
      'S2': 'stuck.png', 
      'S3': 'ready-to-act.png',
      'S4': 'unclear-direction.png'
    };

    // Get data from window.openai (provided by ChatGPT)
    function updateWidget() {
      const toolOutput = window.openai?.toolOutput;
      
      if (!toolOutput) {
        console.log('No tool output available yet');
        return;
      }

      const state = toolOutput.state || 'S1';
      const message = toolOutput.message || '';
      const ask = toolOutput.ask || '';
      const ctaAllowed = toolOutput.cta_allowed || false;
      
      // Update image
      const imageElement = document.getElementById('state-image');
      const imageName = stateImages[state];
      imageElement.src = `/images/${imageName}`;
      imageElement.alt = `${state} - Current State`;
      
      // Update message text
      document.getElementById('message').textContent = message;
      document.getElementById('action').textContent = ask;
      
      // Show/hide CTA based on server response
      const ctaContainer = document.getElementById('cta-container');
      if (ctaAllowed) {
        ctaContainer.classList.add('visible');
      } else {
        ctaContainer.classList.remove('visible');
      }
    }

    // Run on load
    if (window.openai) {
      updateWidget();
    }

    // Listen for updates (if ChatGPT provides them)
    if (window.openai?.addEventListener) {
      window.openai.addEventListener('toolOutput', updateWidget);
    }
  </script>
</body>
</html>
